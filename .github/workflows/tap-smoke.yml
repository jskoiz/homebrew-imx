name: Homebrew Tap Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - Formula/imx.rb
      - scripts/**
      - .github/workflows/tap-smoke.yml
  pull_request:
    branches:
      - main
    paths:
      - Formula/imx.rb
      - scripts/**
      - .github/workflows/tap-smoke.yml
  schedule:
    - cron: "22 11 * * 1"

jobs:
  smoke:
    name: Formula archive smoke linux
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - name: Check hosted Apple Actions guard
        run: |
          set -euo pipefail
          bash scripts/check-no-hosted-apple-actions.sh

      - name: Validate formula syntax
        run: |
          set -euo pipefail
          ruby -c Formula/imx.rb

      - name: Install optional Linux arm64 validation dependencies
        run: |
          set -euo pipefail
          if grep -Fq 'aarch64-unknown-linux-gnu' Formula/imx.rb; then
            sudo apt-get update -y
            sudo apt-get install -y binutils-aarch64-linux-gnu qemu-user
          fi

      - name: Verify Linux formula archives
        run: |
          set -euo pipefail
          bash scripts/verify-formula-archives.sh
